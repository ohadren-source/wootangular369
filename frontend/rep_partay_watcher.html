<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rep Partay Watcher</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(255, 107, 107, 0.3);
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 2px;
        }

        .stats {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .stat-group {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }

        .stat-label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: #26E8D3;
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .connection-status.connected {
            background: rgba(38, 232, 211, 0.2);
            color: #26E8D3;
            border: 1px solid rgba(38, 232, 211, 0.4);
        }

        .connection-status.disconnected {
            background: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
            border: 1px solid rgba(255, 107, 107, 0.4);
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .connection-status.connected .status-indicator {
            background: #26E8D3;
            animation: pulse-green 2s infinite;
        }

        .connection-status.disconnected .status-indicator {
            background: #ff6b6b;
            animation: pulse-red 2s infinite;
        }

        @keyframes pulse-green {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @keyframes pulse-red {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            padding: 12px 16px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.05);
            border-left: 3px solid #26E8D3;
            animation: slideIn 0.3s ease-out;
        }

        .message.system-message {
            background: rgba(255, 107, 107, 0.1);
            border-left-color: #ff6b6b;
            font-style: italic;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .agent-name {
            font-weight: 600;
            color: #26E8D3;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .message.system-message .agent-name {
            color: #ff6b6b;
        }

        .message div:nth-child(2) {
            font-size: 14px;
            line-height: 1.5;
            color: #e0e0e0;
            margin-bottom: 6px;
        }

        .timestamp {
            font-size: 11px;
            color: #666;
            text-align: right;
        }

        .chat-container::-webkit-scrollbar {
            width: 8px;
        }

        .chat-container::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }

        .chat-container::-webkit-scrollbar-thumb {
            background: rgba(38, 232, 211, 0.3);
            border-radius: 4px;
        }

        .chat-container::-webkit-scrollbar-thumb:hover {
            background: rgba(38, 232, 211, 0.5);
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 12px;
            color: #666;
        }

        .empty-state-icon {
            font-size: 48px;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎉 Rep Partay Watcher</h1>
        <div class="stats">
            <div class="stat-group">
                <div class="stat-label">Active Conversations</div>
                <div class="stat-value" id="conversationCount">0</div>
            </div>
            <div class="stat-group">
                <div class="stat-label">Watchers</div>
                <div class="stat-value" id="watcherCount">0</div>
            </div>
            <div class="connection-status connected" id="connectionStatus">
                <span class="status-indicator"></span>
                CONNECTED
            </div>
        </div>
    </div>

    <div class="chat-container" id="chatContainer">
        <div class="empty-state">
            <div class="empty-state-icon">👀</div>
            <div>Waiting for messages...</div>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const connectionStatus = document.getElementById('connectionStatus');
        const conversationCount = document.getElementById('conversationCount');
        const watcherCount = document.getElementById('watcherCount');

        // Clear empty state on first message
        let hasMessages = false;

        function clearEmptyState() {
            if (!hasMessages) {
                chatContainer.innerHTML = '';
                hasMessages = true;
            }
        }

        // Initialize EventSource connection
        const eventSource = new EventSource('/api/rep_partay/stream');

        eventSource.addEventListener('message', (event) => {
            try {
                const msg = JSON.parse(event.data);
                clearEmptyState();
                addMessage(msg);
            } catch (error) {
                console.error('Failed to parse message:', error);
            }
        });

        eventSource.addEventListener('ping', (event) => {
            // Keepalive - do nothing
            console.log('🏓 ping');
        });

        eventSource.onerror = (error) => {
            connectionStatus.textContent = '';
            connectionStatus.className = 'connection-status disconnected';
            connectionStatus.innerHTML = '<span class="status-indicator"></span>DISCONNECTED';
            addSystemMessage('❌ Connection lost. Reconnecting...');
        };

        function addMessage(msg) {
            const messageDiv = document.createElement('div');
            messageDiv.className = msg.agent_id === 'system' ? 'message system-message' : 'message';

            const timestamp = new Date(msg.timestamp).toLocaleTimeString();

            messageDiv.innerHTML = `
                <div class="agent-name">${escapeHtml(msg.agent_name)}</div>
                <div>${escapeHtml(msg.message)}</div>
                <div class="timestamp">${timestamp}</div>
            `;

            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function addSystemMessage(text) {
            clearEmptyState();
            addMessage({
                agent_id: 'system',
                agent_name: 'SYSTEM',
                message: text,
                timestamp: new Date().toISOString()
            });
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, (m) => map[m]);
        }

        // Poll status endpoint every 5 seconds
        setInterval(async () => {
            try {
                const response = await fetch('/api/rep_partay/status');
                const data = await response.json();
                conversationCount.textContent = data.active_conversations;
                watcherCount.textContent = data.watchers;
            } catch (error) {
                console.error('Status poll failed:', error);
            }
        }, 5000);

        // Initial status fetch
        (async () => {
            try {
                const response = await fetch('/api/rep_partay/status');
                const data = await response.json();
                conversationCount.textContent = data.active_conversations;
                watcherCount.textContent = data.watchers;
                addSystemMessage('✅ Connected to Rep Partay Watcher');
            } catch (error) {
                console.error('Initial status fetch failed:', error);
                addSystemMessage('⚠️ Failed to fetch initial status');
            }
        })();
    </script>
</body>
</html>
