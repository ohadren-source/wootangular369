<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sol Calarbone 8</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Courier New', monospace;
      background: #0a0a0a;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* ── LOGIN SCREEN ── */
    #loginScreen {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: 100%;
      max-width: 420px;
      padding: 40px 24px;
    }

    #loginScreen h1 {
      font-size: 2rem;
      color: #f0c040;
      letter-spacing: 2px;
      text-align: center;
    }

    #loginScreen p.tagline {
      color: #888;
      font-size: 0.85rem;
      text-align: center;
    }

    .login-field {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .login-field label {
      font-size: 0.75rem;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .login-field input {
      width: 100%;
      padding: 12px 14px;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 4px;
      color: #e0e0e0;
      font-family: 'Courier New', monospace;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .login-field input:focus {
      border-color: #f0c040;
    }

    #loginBtn {
      width: 100%;
      padding: 14px;
      background: #f0c040;
      color: #0a0a0a;
      border: none;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      letter-spacing: 1px;
      transition: background 0.2s;
    }

    #loginBtn:hover { background: #ffd060; }
    #loginBtn:disabled { background: #555; color: #888; cursor: not-allowed; }

    #loginError {
      color: #e05050;
      font-size: 0.85rem;
      text-align: center;
      min-height: 20px;
    }

    /* ── CHAT SCREEN ── */
    #chatScreen {
      display: none;
      flex-direction: column;
      width: 100%;
      max-width: 860px;
      height: 100vh;
      padding: 0;
    }

    #chatHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: #111;
      border-bottom: 1px solid #222;
      flex-shrink: 0;
    }

    #chatHeader .title {
      font-size: 1.1rem;
      color: #f0c040;
      letter-spacing: 1px;
    }

    #chatHeader .user-badge {
      font-size: 0.75rem;
      color: #888;
      background: #1a1a1a;
      padding: 4px 10px;
      border-radius: 12px;
      border: 1px solid #333;
    }

    #chatHeader .user-badge.admin {
      color: #f0c040;
      border-color: #f0c040;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: #0a0a0a;
    }

    .message {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-width: 80%;
    }

    .message.user { align-self: flex-end; }
    .message.assistant { align-self: flex-start; }

    .message .bubble {
      padding: 12px 16px;
      border-radius: 8px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.92rem;
    }

    .message.user .bubble {
      background: #1e2a1e;
      border: 1px solid #2a4a2a;
      color: #c0e0c0;
    }

    .message.assistant .bubble {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      color: #d0d0f0;
    }

    .message .meta {
      font-size: 0.7rem;
      color: #555;
      padding: 0 4px;
    }

    .message.user .meta { text-align: right; }

    /* typing indicator */
    .typing-indicator {
      display: flex;
      gap: 5px;
      padding: 12px 16px;
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 8px;
      align-self: flex-start;
    }

    .typing-indicator span {
      width: 8px;
      height: 8px;
      background: #6060c0;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }

    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-8px); }
    }

    /* input area */
    #inputArea {
      display: flex;
      gap: 10px;
      padding: 14px 20px;
      background: #111;
      border-top: 1px solid #222;
      flex-shrink: 0;
    }

    #messageInput {
      flex: 1;
      padding: 12px 14px;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 4px;
      color: #e0e0e0;
      font-family: 'Courier New', monospace;
      font-size: 0.95rem;
      outline: none;
      resize: none;
      min-height: 46px;
      max-height: 160px;
      transition: border-color 0.2s;
    }

    #messageInput:focus { border-color: #f0c040; }

    #sendBtn {
      padding: 12px 20px;
      background: #f0c040;
      color: #0a0a0a;
      border: none;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      letter-spacing: 1px;
      transition: background 0.2s;
      align-self: flex-end;
    }

    #sendBtn:hover { background: #ffd060; }
    #sendBtn:disabled { background: #555; color: #888; cursor: not-allowed; }

    /* scrollbar */
    #messages::-webkit-scrollbar { width: 6px; }
    #messages::-webkit-scrollbar-track { background: #0a0a0a; }
    #messages::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
  </style>
</head>
<body>

  <!-- ── LOGIN SCREEN ── -->
  <div id="loginScreen">
    <h1>Sol Calarbone 8</h1>
    <p class="tagline">The hive made articulate. VENIM.US.</p>

    <div class="login-field">
      <label for="usernameInput">Username</label>
      <input type="text" id="usernameInput" placeholder="Enter username" autocomplete="username" />
    </div>

    <div class="login-field">
      <label for="passwordInput">Password</label>
      <input type="password" id="passwordInput" placeholder="Enter password" autocomplete="current-password" />
    </div>

    <div id="loginError"></div>

    <button id="loginBtn" onclick="login()">ENTER</button>
  </div>

  <!-- ── CHAT SCREEN ── -->
  <div id="chatScreen">
    <div id="chatHeader">
      <span class="title">SOL CALARBONE 8</span>
      <span id="userBadge" class="user-badge">GUEST</span>
    </div>

    <div id="messages"></div>

    <div id="inputArea">
      <textarea
        id="messageInput"
        placeholder="Type your message…"
        rows="1"
        onkeydown="handleKeyDown(event)"
        oninput="autoResize(this)"
      ></textarea>
      <button id="sendBtn" onclick="sendMessage()">SEND</button>
    </div>
  </div>

  <script>
    // ── State ──────────────────────────────────────────────────────────────
    let currentUsername = '';
    let currentPassword = '';
    let isAdmin = false;
    let chatHistory = [];
    let isSending = false;

    // ── Login ──────────────────────────────────────────────────────────────
    async function login() {
      const username = document.getElementById('usernameInput').value.trim();
      const password = document.getElementById('passwordInput').value;
      const errorEl = document.getElementById('loginError');
      const btn = document.getElementById('loginBtn');

      errorEl.textContent = '';

      if (!username || !password) {
        errorEl.textContent = 'Username and password required.';
        return;
      }

      currentUsername = username;
      currentPassword = password;

      btn.disabled = true;
      btn.textContent = 'CONNECTING…';

      try {
        // Send a greeting to validate credentials and get the first response
        const result = await callChat('hello');

        if (result === null) {
          // Error already shown
          btn.disabled = false;
          btn.textContent = 'ENTER';
          return;
        }

        // Switch to chat screen
        document.getElementById('loginScreen').style.display = 'none';
        const chatScreen = document.getElementById('chatScreen');
        chatScreen.style.display = 'flex';

        // Update badge
        const badge = document.getElementById('userBadge');
        if (isAdmin) {
          badge.textContent = currentUsername.toUpperCase() + ' · ADMIN';
          badge.classList.add('admin');
        } else {
          badge.textContent = currentUsername.toUpperCase();
        }

        // Append the greeting exchange to the UI
        appendMessage('user', 'hello');
        appendMessage('assistant', result);

        // Focus input
        document.getElementById('messageInput').focus();

      } catch (err) {
        errorEl.textContent = 'Connection failed. Try again.';
        btn.disabled = false;
        btn.textContent = 'ENTER';
      }
    }

    // ── Send Message ───────────────────────────────────────────────────────
    async function sendMessage() {
      if (isSending) return;

      const input = document.getElementById('messageInput');
      const msg = input.value.trim();
      if (!msg) return;

      input.value = '';
      autoResize(input);

      appendMessage('user', msg);
      showTyping();

      const btn = document.getElementById('sendBtn');
      btn.disabled = true;
      isSending = true;

      try {
        const reply = await callChat(msg);
        hideTyping();
        if (reply !== null) {
          appendMessage('assistant', reply);
        }
      } catch (err) {
        hideTyping();
        appendMessage('assistant', '⚠ Connection error. Please try again.');
      } finally {
        btn.disabled = false;
        isSending = false;
        input.focus();
      }
    }

    // ── Core API Call ──────────────────────────────────────────────────────
    async function callChat(message) {
      const errorEl = document.getElementById('loginError');

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: message,
            history: chatHistory,
            username: currentUsername,
            password: currentPassword
          })
        });

        if (!response.ok) {
          const err = await response.json().catch(() => ({}));
          if (errorEl) errorEl.textContent = err.message || 'Server error.';
          return null;
        }

        const data = await response.json();

        // Update admin status from response
        if (data.is_admin !== undefined) {
          isAdmin = data.is_admin;
        }

        const reply = data.response || data.content || '';

        // Update history for context
        chatHistory.push({ role: 'user', content: message });
        chatHistory.push({ role: 'assistant', content: reply });

        // Keep history manageable (last 20 exchanges = 40 messages)
        if (chatHistory.length > 40) {
          chatHistory = chatHistory.slice(chatHistory.length - 40);
        }

        return reply;

      } catch (err) {
        if (errorEl) errorEl.textContent = 'Network error. Check connection.';
        return null;
      }
    }

    // ── UI Helpers ─────────────────────────────────────────────────────────
    function appendMessage(role, text) {
      const container = document.getElementById('messages');

      const wrapper = document.createElement('div');
      wrapper.className = 'message ' + role;

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;

      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = role === 'user'
        ? (currentUsername || 'you')
        : 'Sol Calarbone 8';

      wrapper.appendChild(bubble);
      wrapper.appendChild(meta);
      container.appendChild(wrapper);

      scrollToBottom();
    }

    let typingEl = null;

    function showTyping() {
      const container = document.getElementById('messages');
      typingEl = document.createElement('div');
      typingEl.className = 'typing-indicator';
      typingEl.innerHTML = '<span></span><span></span><span></span>';
      container.appendChild(typingEl);
      scrollToBottom();
    }

    function hideTyping() {
      if (typingEl) {
        typingEl.remove();
        typingEl = null;
      }
    }

    function scrollToBottom() {
      const container = document.getElementById('messages');
      container.scrollTop = container.scrollHeight;
    }

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 160) + 'px';
    }

    function handleKeyDown(event) {
      // Send on Enter (without Shift)
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    }

    // ── Allow pressing Enter on login fields ───────────────────────────────
    document.getElementById('usernameInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') document.getElementById('passwordInput').focus();
    });

    document.getElementById('passwordInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') login();
    });
  </script>
</body>
</html>
